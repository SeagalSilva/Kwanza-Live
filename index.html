<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e1712">
  <title>Kwanza Live</title>
  <meta name="description" content="Multiplayer 2D farming world with planting, harvesting, trading, and private lands.">
  <meta property="og:title" content="Kwanza Live">
  <meta property="og:description" content="Multiplayer 2D farming world with planting, harvesting, trading, and private lands.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌽%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/modal.css">
  <script src="/api/config.js"></script>
</head>
<body data-screen="loading">

  <!-- Language + sign-out (always on top) -->
  <div class="topbar">
    <button id="langBtn" class="round" type="button" data-i18n-title="lang.switch">PT</button>
    <button id="logoutBtn" class="round" type="button" data-i18n-title="hud.logout" hidden>⎋</button>
  </div>

  <!-- Loading -->
  <main id="screen-loading" class="screen active">
    <div class="loader"></div>
    <p data-i18n="loading">Loading…</p>
  </main>

  <!-- Login -->
  <main id="screen-login" class="screen">
    <div class="panel hero">
      <div class="logo">Kwanza <span>Live</span></div>
      <p class="tag" data-i18n="login.tag"></p>
      <button id="btn-google" class="btn gold big" type="button">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        <span data-i18n="login.google"></span>
      </button>
      <button id="btn-guest" class="btn alt" type="button" style="margin-top: 10px; width: 100%;">
        <span data-i18n="login.guest">Play as Guest</span>
      </button>
      <p id="login-msg" class="status bad" role="alert"></p>
      <ul class="how">
        <li data-i18n="login.how1"></li>
        <li data-i18n="login.how2"></li>
        <li data-i18n="login.how3"></li>
      </ul>
    </div>
  </main>

  <!-- Username + character creation -->
  <main id="screen-onboard" class="screen">
    <div class="panel">
      <section id="ob-step1">
        <h1 data-i18n="ob.step1.title"></h1>
        <label for="ob-username" data-i18n="ob.username.label"></label>
        <input id="ob-username" type="text" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p class="hint" data-i18n="ob.username.hint"></p>
        <p id="ob-status" class="status" role="status"></p>
        <button id="ob-next" class="btn gold big" type="button" disabled data-i18n="ob.next"></button>
      </section>

      <section id="ob-step2" hidden>
        <h1 data-i18n="ob.step2.title"></h1>
        <canvas id="ob-preview" width="260" height="260"></canvas>
        <p class="hint center" data-i18n="ob.tapTurn"></p>
        <label data-i18n="ob.skin"></label><div id="ob-skin" class="swatches"></div>
        <label data-i18n="ob.hairStyle"></label><div id="ob-styles" class="chips"></div>
        <label data-i18n="ob.hair"></label><div id="ob-hair" class="swatches"></div>
        <label data-i18n="ob.shirt"></label><div id="ob-shirt" class="swatches"></div>
        <p id="ob-error" class="status bad" role="alert"></p>
        <div class="row-btns">
          <button id="ob-back" class="btn alt" type="button" data-i18n="ob.back"></button>
          <button id="ob-create" class="btn gold big" type="button" data-i18n="ob.create"></button>
        </div>
      </section>
    </div>
  </main>

  <!-- Game -->
  <div id="screen-game" class="screen">
    <canvas id="world"></canvas>

    <div class="hud">
      <div class="hud-me">
        <canvas id="hud-portrait" width="112" height="112"></canvas>
        <div class="hud-me-info">
          <strong id="hud-name"></strong>
          <div class="wallet" id="hud-wallet"></div>
        </div>
      </div>

      <div class="hud-side">
        <button id="btn-inv" class="round" type="button" data-i18n-title="hud.inventory">🎒</button>
        <button id="btn-wallet" class="round" type="button" data-i18n-title="hud.wallet">👛</button>
        <button id="btn-chat" class="round" type="button" data-i18n-title="hud.chat">💬</button>
      </div>

      <div class="hotbar" id="hotbar"></div>

      <div id="chat-widget" class="chat-widget">
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" maxlength="120" data-i18n-placeholder="chat.placeholder" placeholder="Say something..." autocomplete="off" />
          <button type="submit" class="btn gold small" id="chat-send">➤</button>
        </form>
      </div>

      <div class="dpad" id="dpad" hidden>
        <button data-dir="up" type="button">▲</button>
        <button data-dir="left" type="button">◀</button>
        <button data-dir="right" type="button">▶</button>
        <button data-dir="down" type="button">▼</button>
      </div>

      <button id="btn-interact" class="interact" type="button" hidden></button>
      <p class="control-hint" id="hud-hint" data-i18n="hint.controls"></p>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript>Kwanza Live needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
